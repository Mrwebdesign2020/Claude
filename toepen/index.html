<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Toepen scorebord</title>
<style>
  :root {
    --bg: #0f3d24; --felt: #14532d; --card: #fffdf7; --ink: #1c1917;
    --muted: #78716c; --red: #b91c1c; --gold: #d4a017; --line: #e7e5e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--felt), var(--bg)); color: var(--ink);
    min-height: 100vh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { color: #fff; font-size: 1.5rem; margin: 4px 0 16px; display: flex; align-items: center; gap: 8px; }
  h1 small { font-weight: 400; font-size: .85rem; opacity: .7; margin-left: auto; }
  .panel { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .panel h2 { margin: 0 0 12px; font-size: 1.05rem; }
  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=number] {
    width: 100%; font-size: 1.05rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  button {
    font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: #e7e5e4; color: var(--ink); font-weight: 600; touch-action: manipulation;
  }
  button:active { transform: scale(.96); }
  button.primary { background: var(--felt); color: #fff; }
  button.danger { background: var(--red); color: #fff; }
  button.gold { background: var(--gold); color: #1c1917; }
  button:disabled { opacity: .4; cursor: default; transform: none; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { background: #f5f5f4; border-radius: 999px; padding: 6px 6px 6px 12px; display: flex; align-items: center; gap: 6px; }
  .chip button { padding: 2px 8px; border-radius: 999px; background: transparent; color: var(--muted); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button.on { background: var(--felt); color: #fff; }

  /* Inzet */
  .stake { display: flex; align-items: center; gap: 10px; }
  .stake .val { font-size: 2.2rem; font-weight: 800; min-width: 48px; text-align: center; }
  .stake .lbl { flex: 1; font-size: .9rem; color: var(--muted); line-height: 1.2; }

  /* Spelers */
  .player { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .player:first-of-type { border-top: 0; padding-top: 0; }
  .name { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: .7rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; }
  .badge.arm { background: #fef3c7; color: #92400e; }
  .badge.dood { background: #fee2e2; color: var(--red); }
  .badge.win { background: var(--gold); color: #1c1917; }
  .bar { height: 8px; background: #f5f5f4; border-radius: 99px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--felt); border-radius: 99px; transition: width .25s; }
  .bar > div.warn { background: #d97706; }
  .bar > div.out { background: var(--red); }
  .meta { font-size: .8rem; color: var(--muted); margin-top: 4px; }
  .score { font-size: 2rem; font-weight: 800; text-align: right; min-width: 70px; }
  .score small { font-size: .9rem; color: var(--muted); font-weight: 500; }
  .actions { grid-column: 1 / -1; display: flex; gap: 6px; }
  .actions .big { flex: 1; }
  .player.out .name, .player.out .score { opacity: .45; text-decoration: line-through; }
  .player.out .actions { display: none; }

  .winner { text-align: center; padding: 22px 16px; }
  .winner .trophy { font-size: 3rem; }
  .winner h2 { font-size: 1.5rem; margin: 6px 0 14px; }
  .footer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .footer-actions button { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  td { padding: 6px 0; border-top: 1px solid var(--line); }
  td:last-child { text-align: right; font-weight: 700; }
  .hint { font-size: .85rem; color: var(--muted); margin: 10px 0 0; line-height: 1.4; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: grid; place-items: center; padding: 20px; }
  .modal .panel { max-width: 360px; width: 100%; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1c1917; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .95; }
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const KEY = 'toepen-scorebord-v1';
const defaultState = () => ({
  phase: 'setup',        // setup | play
  players: [],           // {name, score}
  max: 15,
  stake: 1,
  history: [],           // snapshots of scores for undo
  wins: {},              // name -> potjes gewonnen
  round: 1,
});
let S = load();

function load() {
  try { return Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch { return defaultState(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function ask(msg) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = `<div class="panel"><p>${esc(msg)}</p><div class="footer-actions"><button data-v="0">Annuleren</button><button class="danger" data-v="1">Ja</button></div></div>`;
    d.onclick = e => { const v = e.target.dataset.v; if (v !== undefined) { d.remove(); res(v === '1'); } };
    document.body.appendChild(d);
  });
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
}

const alive = () => S.players.filter(p => p.score < S.max);
const winner = () => (S.phase === 'play' && S.players.length > 1 && alive().length === 1) ? alive()[0] : null;

function snapshot() {
  S.history.push({ scores: S.players.map(p => p.score), stake: S.stake, round: S.round });
  if (S.history.length > 200) S.history.shift();
}

/* ---------- acties ---------- */
const A = {
  addPlayer() {
    const inp = document.getElementById('newName');
    const name = inp.value.trim();
    if (!name) return;
    if (S.players.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast('Die naam bestaat al'); return; }
    S.players.push({ name, score: 0 });
    save(); render();
    document.getElementById('newName').focus();
  },
  removePlayer(i) { S.players.splice(i, 1); save(); render(); },
  setMax(v) { S.max = Math.max(2, parseInt(v) || 15); save(); render(); },
  start() {
    if (S.players.length < 2) { toast('Minimaal 2 spelers'); return; }
    S.players.forEach(p => p.score = 0);
    Object.assign(S, { phase: 'play', stake: 1, history: [], round: 1 });
    save(); render();
  },
  stake(d) { S.stake = Math.max(1, S.stake + d); save(); render(); },
  add(i, n) {
    const p = S.players[i];
    if (p.score >= S.max && n > 0) return;
    snapshot();
    p.score = Math.max(0, p.score + n);
    if (p.score >= S.max) toast(`${p.name} ligt eruit 💀`);
    save(); render();
  },
  nextRound() {
    snapshot();
    S.stake = 1; S.round++;
    save(); render();
    toast(`Ronde ${S.round} — inzet terug naar 1`);
  },
  undo() {
    const h = S.history.pop();
    if (!h) return;
    S.players.forEach((p, i) => p.score = h.scores[i] ?? p.score);
    S.stake = h.stake; S.round = h.round;
    save(); render(); toast('Ongedaan gemaakt');
  },
  async newGame() {
    const w = winner();
    if (w) S.wins[w.name] = (S.wins[w.name] || 0) + 1;
    else if (!await ask('Nieuw potje beginnen? De huidige stand gaat verloren.')) return;
    S.players.forEach(p => p.score = 0);
    Object.assign(S, { stake: 1, history: [], round: 1 });
    save(); render();
  },
  async toSetup() {
    if (!winner() && S.history.length && !await ask('Terug naar spelers? Het huidige potje wordt gestopt.')) return;
    S.phase = 'setup'; save(); render();
  },
  async resetAll() {
    if (!await ask('Alles wissen, inclusief spelers en gewonnen potjes?')) return;
    S = defaultState(); save(); render();
  },
};

/* ---------- weergave ---------- */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = S.phase === 'setup' ? setupView() : playView();
  const inp = document.getElementById('newName');
  if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') A.addPlayer(); });
}

function setupView() {
  return `
  <h1>🃏 Toepen</h1>
  <div class="panel">
    <h2>Spelers</h2>
    <div class="row">
      <input id="newName" type="text" placeholder="Naam speler" autocomplete="off" maxlength="20">
      <button class="primary" onclick="A.addPlayer()">Voeg toe</button>
    </div>
    <div class="chips">
      ${S.players.map((p, i) => `<span class="chip">${esc(p.name)}<button onclick="A.removePlayer(${i})" aria-label="Verwijder">✕</button></span>`).join('') || '<span class="hint" style="margin:0">Nog geen spelers</span>'}
    </div>
  </div>
  <div class="panel">
    <h2>Je ligt eruit bij</h2>
    <div class="seg">
      ${[10, 15, 21].map(v => `<button class="${S.max === v ? 'on' : ''}" onclick="A.setMax(${v})">${v} punten</button>`).join('')}
      <input type="number" min="2" value="${S.max}" style="width:90px" onchange="A.setMax(this.value)" aria-label="Eigen aantal">
    </div>
    <p class="hint">Op ${S.max - 1} punten sta je op <b>armoede</b>.</p>
  </div>
  <button class="primary" style="width:100%;padding:14px;font-size:1.1rem" onclick="A.start()">Start potje (${S.players.length} spelers)</button>
  ${winsTable()}
  `;
}

function playView() {
  const w = winner();
  const ranked = S.players.map((p, i) => ({ ...p, i }));
  return `
  <h1>🃏 Toepen <small>Ronde ${S.round} · eruit bij ${S.max}</small></h1>
  ${w ? `
    <div class="panel winner">
      <div class="trophy">🏆</div>
      <h2>${esc(w.name)} wint!</h2>
      <div class="footer-actions">
        <button class="primary" onclick="A.newGame()">Nieuw potje</button>
      </div>
    </div>` : `
    <div class="panel">
      <div class="stake">
        <div class="lbl"><b style="color:var(--ink)">Inzet deze ronde</b><br>Elke toep = +1</div>
        <button onclick="A.stake(-1)" ${S.stake <= 1 ? 'disabled' : ''}>−</button>
        <div class="val">${S.stake}</div>
        <button class="gold" onclick="A.stake(1)">Toep! +1</button>
      </div>
    </div>`}
  <div class="panel">
    ${ranked.map(p => playerRow(p)).join('')}
  </div>
  <div class="footer-actions" style="margin-bottom:14px">
    ${w ? '' : `<button class="primary" onclick="A.nextRound()">Volgende ronde</button>`}
    <button onclick="A.undo()" ${S.history.length ? '' : 'disabled'}>↶ Ongedaan</button>
  </div>
  <div class="footer-actions" style="margin-bottom:14px">
    <button onclick="A.newGame()">Nieuw potje</button>
    <button onclick="A.toSetup()">Spelers / instellingen</button>
  </div>
  ${winsTable()}
  <p class="hint" style="color:#d6d3d1">Tip: tik op <b>+${S.stake}</b> bij wie de ronde verliest. Wie past na een toep krijgt de oude inzet — gebruik daarvoor +1 (of meerdere keren). Alles wordt bewaard op dit toestel.</p>
  `;
}

function playerRow(p) {
  const out = p.score >= S.max;
  const arm = !out && p.score === S.max - 1;
  const w = winner();
  const pct = Math.min(100, p.score / S.max * 100);
  const left = S.max - p.score;
  return `
  <div class="player ${out ? 'out' : ''}">
    <div>
      <div class="name">${esc(p.name)}
        ${w && w.name === p.name ? '<span class="badge win">Winnaar</span>' : ''}
        ${arm ? '<span class="badge arm">Armoede</span>' : ''}
        ${out ? '<span class="badge dood">Eruit</span>' : ''}
      </div>
      <div class="bar"><div class="${out ? 'out' : (left <= 3 ? 'warn' : '')}" style="width:${pct}%"></div></div>
      <div class="meta">${out ? 'Uitgespeeld' : `nog ${left} ${left === 1 ? 'punt' : 'punten'} over`}</div>
    </div>
    <div class="score">${p.score}<small>/${S.max}</small></div>
    ${w ? '' : `
    <div class="actions">
      <button onclick="A.add(${p.i}, -1)" ${p.score <= 0 ? 'disabled' : ''} aria-label="Min 1">−1</button>
      <button onclick="A.add(${p.i}, 1)">+1</button>
      <button class="danger big" onclick="A.add(${p.i}, ${S.stake})">+${S.stake} verloren</button>
    </div>`}
  </div>`;
}

function winsTable() {
  const entries = Object.entries(S.wins).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '';
  return `
  <div class="panel">
    <h2>Gewonnen potjes</h2>
    <table>${entries.map(([n, c]) => `<tr><td>${esc(n)}</td><td>${c}</td></tr>`).join('')}</table>
    <p class="hint"><a href="#" onclick="A.resetAll();return false" style="color:var(--red)">Alles wissen</a></p>
  </div>`;
}

render();
</script>
</body>
</html>
